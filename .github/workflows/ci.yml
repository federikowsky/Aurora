name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admission-cost:
    if: github.event_name == 'pull_request'
    name: Admission A/A–A/B evidence (not a readiness gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DUB_HOME: ${{ github.workspace }}/.cost-home
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.42.0
      - name: Build pinned servers and load generator
        run: |
          set -euo pipefail
          mkdir -p artifacts/cost
          git rev-parse HEAD > artifacts/cost/candidate-sha.txt
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git worktree add --detach ../cost-base "$BASE_SHA"
          git -C ../cost-base rev-parse HEAD > artifacts/cost/base-sha.txt
          git status --porcelain=v1 > artifacts/cost/status.txt
          uname -a > artifacts/cost/uname.txt
          lscpu > artifacts/cost/lscpu.txt
          free -h > artifacts/cost/memory.txt
          cat /sys/fs/cgroup/cpu.max /sys/fs/cgroup/memory.max > artifacts/cost/quotas.txt
          ldc2 --version > artifacts/cost/ldc.txt
          dub --version > artifacts/cost/dub.txt
          c++ --version > artifacts/cost/cxx.txt
          (cd ../cost-base && dub build benchmarks/server.d --single --compiler=ldc2 --build=release) 2>&1 | tee artifacts/cost/base-build.log
          dub build benchmarks/server.d --single --compiler=ldc2 --build=release 2>&1 | tee artifacts/cost/candidate-build.log
          git clone --no-tags https://github.com/wg/wrk.git ../cost-wrk
          git -C ../cost-wrk checkout --detach a211dd5a7050b1f9e8a9870b95513060e72ac4a0
          git -C ../cost-wrk rev-parse HEAD > artifacts/cost/wrk-sha.txt
          make -C ../cost-wrk -j2 WITH_OPENSSL=/usr > artifacts/cost/wrk-build.log 2>&1
          ldd ../cost-wrk/wrk > artifacts/cost/wrk-libraries.txt
      - name: Collect rotating identical-baseline and candidate comparisons
        run: |
          set -o pipefail
          python3 benchmarks/compare_admission.py ../cost-base/benchmarks/aurora_benchmark ./benchmarks/aurora_benchmark ../cost-wrk/wrk artifacts/cost/disabled | tee artifacts/cost/progress.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aurora-admission-cost-${{ github.event.pull_request.head.sha }}
          path: artifacts/cost
          if-no-files-found: error

  dub:
    name: DUB build and unit tests (LDC)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DUB_HOME: ${{ github.workspace }}/.ci-home

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Capture runner context
        run: |
          set -o pipefail
          mkdir -p artifacts/ci
          uname -a | tee artifacts/ci/uname.txt
          lscpu | tee artifacts/ci/lscpu.txt
          free -h | tee artifacts/ci/memory.txt

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.42.0

      - name: Show toolchain
        run: |
          set -o pipefail
          ldc2 --version 2>&1 | tee artifacts/ci/ldc.txt
          dub --version 2>&1 | tee artifacts/ci/dub.txt
          c++ --version 2>&1 | tee artifacts/ci/cxx.txt

      - name: Build library
        run: |
          set -o pipefail
          dub build --compiler=ldc2 2>&1 | tee artifacts/ci/build-debug.log

      - name: Build release library
        run: |
          set -o pipefail
          dub build --compiler=ldc2 --build=release 2>&1 | tee artifacts/ci/build-release.log

      - name: Check logger process lifecycle
        run: |
          set -o pipefail
          for build in debug release; do
            flags=""
            if [ "$build" = release ]; then flags="-O2 -release -enable-inlining"; fi
            ldc2 $flags -i -Isource tests/fixtures/logger_lifecycle.d \
              -of="artifacts/ci/logger-$build" 2>&1 \
              | tee "artifacts/ci/logger-$build-build.log"
            python3 tests/integration/logger_lifecycle_probe.py \
              "artifacts/ci/logger-$build" 2>&1 \
              | tee "artifacts/ci/logger-$build.log"
          done

      - name: Run unit tests
        run: |
          set -o pipefail
          dub test --compiler=ldc2 --config=unittest 2>&1 | tee artifacts/ci/unit-tests.log

      - name: Check response buffer contract in release mode
        run: |
          set -o pipefail
          ldc2 -O2 -release -enable-inlining -unittest -main -i -Isource \
            tests/unit/http/response_buffer_test.d \
            -of=artifacts/ci/response-buffer-test 2>&1 \
            | tee artifacts/ci/response-buffer-build.log
          ./artifacts/ci/response-buffer-test 2>&1 \
            | tee artifacts/ci/response-buffer-test.log

      - name: Build documented minimal example
        run: |
          set -o pipefail
          dub build examples/minimal_server.d --single --compiler=ldc2 2>&1 | tee artifacts/ci/minimal-example.log

      - name: Run HTTP protocol integration tests
        run: |
          set -o pipefail
          dub build tests/integration/protocol_probe_server.d --single \
            --compiler=ldc2 --build=release 2>&1 \
            | tee artifacts/ci/http-protocol-build.log
          python3 tests/integration/http_framing_probe.py \
            ./tests/integration/aurora_protocol_probe_server 2>&1 \
            | tee artifacts/ci/http-protocol-probe.log

      - name: Collect release microbenchmark evidence
        # Keep admission checks separate from throughput evidence.
        run: |
          set -o pipefail
          dub run benchmarks/microbench.d --single \
            --compiler=ldc2 --build=release 2>&1 \
            | tee artifacts/ci/microbench.log

      - name: Check request admission in debug and release
        run: |
          set -o pipefail
          for build in debug release; do
            dub build tests/integration/admission_probe_server.d --single --compiler=ldc2 --build="$build" 2>&1 | tee "artifacts/ci/admission-$build-build.log"
            python3 tests/integration/http_admission_probe.py ./tests/integration/aurora_admission_probe_server 2>&1 | tee "artifacts/ci/admission-$build.log"
          done

      - name: Check canonical benchmark configuration
        run: |
          set -o pipefail
          dub build benchmarks/server.d --single --compiler=ldc2 --build=release 2>&1 | tee artifacts/ci/benchmark-build.log
          python3 tests/integration/benchmark_config_probe.py ./benchmarks/aurora_benchmark 2>&1 | tee artifacts/ci/benchmark-config.log
          python3 tests/integration/benchmark_measurement_test.py 2>&1 | tee artifacts/ci/benchmark-measurement-tests.log

      - name: Collect D-GC allocation evidence
        run: |
          set -o pipefail
          dub build benchmarks/allocation_profile.d --single \
            --compiler=ldc2 --build=release 2>&1 \
            | tee artifacts/ci/allocation-profile-build.log
          ./benchmarks/aurora_allocation_profile \
            | tee artifacts/ci/allocation-profile.jsonl

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-linux-${{ github.sha }}
          path: artifacts/ci
          if-no-files-found: error
