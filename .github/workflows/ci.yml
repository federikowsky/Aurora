name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  http-comparison:
    if: github.event_name == 'pull_request'
    name: Paired HTTP evidence (not a performance gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DUB_HOME: ${{ github.workspace }}/.ci-http-home
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.42.0
      - name: Build pinned baseline, candidate and load generator
        run: |
          set -euo pipefail
          mkdir -p artifacts/http
          git rev-parse HEAD | tee artifacts/http/candidate-sha.txt
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git worktree add --detach ../http-baseline "$BASE_SHA"
          git -C ../http-baseline rev-parse HEAD | tee artifacts/http/base-sha.txt
          git status --porcelain=v1 > artifacts/http/git-status.txt
          uname -a > artifacts/http/uname.txt
          lscpu > artifacts/http/lscpu.txt
          free -h > artifacts/http/memory.txt
          ldc2 --version > artifacts/http/ldc.txt
          dub --version > artifacts/http/dub.txt
          c++ --version > artifacts/http/cxx.txt
          (cd ../http-baseline && dub build benchmarks/server.d --single --compiler=ldc2 --build=release) 2>&1 | tee artifacts/http/base-build.log
          dub build benchmarks/server.d --single --compiler=ldc2 --build=release 2>&1 | tee artifacts/http/candidate-build.log
          git clone --no-tags https://github.com/wg/wrk.git ../http-wrk
          git -C ../http-wrk checkout --detach a211dd5a7050b1f9e8a9870b95513060e72ac4a0
          git -C ../http-wrk rev-parse HEAD > artifacts/http/wrk-sha.txt
          make -C ../http-wrk -j2 > artifacts/http/wrk-build.log 2>&1
      - name: Compare with alternating process order
        run: |
          set -euo pipefail
          python3 benchmarks/compare_http.py \
            ../http-baseline/benchmarks/aurora_benchmark \
            ./benchmarks/aurora_benchmark ../http-wrk/wrk artifacts/http \
            | tee artifacts/http/progress.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aurora-http-${{ github.event.pull_request.head.sha }}
          path: artifacts/http
          if-no-files-found: error

  dub:
    name: DUB build and unit tests (LDC)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DUB_HOME: ${{ github.workspace }}/.ci-home

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Capture runner context
        run: |
          set -o pipefail
          mkdir -p artifacts/ci
          uname -a | tee artifacts/ci/uname.txt
          lscpu | tee artifacts/ci/lscpu.txt
          free -h | tee artifacts/ci/memory.txt

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.42.0

      - name: Show toolchain
        run: |
          set -o pipefail
          ldc2 --version 2>&1 | tee artifacts/ci/ldc.txt
          dub --version 2>&1 | tee artifacts/ci/dub.txt
          c++ --version 2>&1 | tee artifacts/ci/cxx.txt

      - name: Build library
        run: |
          set -o pipefail
          dub build --compiler=ldc2 2>&1 | tee artifacts/ci/build-debug.log

      - name: Build release library
        run: |
          set -o pipefail
          dub build --compiler=ldc2 --build=release 2>&1 | tee artifacts/ci/build-release.log

      - name: Run unit tests
        run: |
          set -o pipefail
          dub test --compiler=ldc2 --config=unittest 2>&1 | tee artifacts/ci/unit-tests.log

      - name: Check response buffer contract in release mode
        run: |
          set -o pipefail
          ldc2 -O2 -release -enable-inlining -unittest -main -i -Isource \
            tests/unit/http/response_buffer_test.d \
            -of=artifacts/ci/response-buffer-test 2>&1 \
            | tee artifacts/ci/response-buffer-build.log
          ./artifacts/ci/response-buffer-test 2>&1 \
            | tee artifacts/ci/response-buffer-test.log

      - name: Build documented minimal example
        run: |
          set -o pipefail
          dub build examples/minimal_server.d --single --compiler=ldc2 2>&1 | tee artifacts/ci/minimal-example.log

      - name: Run HTTP protocol integration tests
        run: |
          set -o pipefail
          dub build tests/integration/protocol_probe_server.d --single \
            --compiler=ldc2 --build=release 2>&1 \
            | tee artifacts/ci/http-protocol-build.log
          python3 tests/integration/http_framing_probe.py \
            ./tests/integration/aurora_protocol_probe_server 2>&1 \
            | tee artifacts/ci/http-protocol-probe.log

      - name: Check request admission in debug and release
        run: |
          set -o pipefail
          for build in debug release; do
            dub build tests/integration/admission_probe_server.d --single \
              --compiler=ldc2 --build="$build" 2>&1 \
              | tee "artifacts/ci/admission-$build-build.log"
            python3 tests/integration/http_admission_probe.py \
              ./tests/integration/aurora_admission_probe_server 2>&1 \
              | tee "artifacts/ci/admission-$build.log"
          done

      - name: Collect release microbenchmark evidence
        run: |
          set -o pipefail
          dub run benchmarks/microbench.d --single \
            --compiler=ldc2 --build=release 2>&1 \
            | tee artifacts/ci/microbench.log

      - name: Collect D-GC allocation evidence
        run: |
          set -o pipefail
          dub build benchmarks/allocation_profile.d --single \
            --compiler=ldc2 --build=release 2>&1 \
            | tee artifacts/ci/allocation-profile-build.log
          ./benchmarks/aurora_allocation_profile \
            | tee artifacts/ci/allocation-profile.jsonl

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-linux-${{ github.sha }}
          path: artifacts/ci
          if-no-files-found: error
