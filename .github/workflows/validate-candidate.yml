name: Validate Candidate Ref

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Branch, tag, or commit SHA to validate
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: candidate-validation-${{ inputs.candidate_ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate ${{ inputs.candidate_ref }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DUB_HOME: ${{ github.workspace }}/.ci-home

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Capture candidate and runner context
        run: |
          set -o pipefail
          mkdir -p artifacts/candidate
          git rev-parse HEAD | tee artifacts/candidate/commit-sha.txt
          git status --porcelain=v1 | tee artifacts/candidate/git-status.txt
          uname -a | tee artifacts/candidate/uname.txt
          lscpu | tee artifacts/candidate/lscpu.txt
          free -h | tee artifacts/candidate/memory.txt

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.42.0

      - name: Show toolchain
        run: |
          set -o pipefail
          ldc2 --version 2>&1 | tee artifacts/candidate/ldc.txt
          dub --version 2>&1 | tee artifacts/candidate/dub.txt
          c++ --version 2>&1 | tee artifacts/candidate/cxx.txt

      - name: Build debug
        run: |
          set -o pipefail
          HOME="$DUB_HOME" dub build --compiler=ldc2 2>&1 \
            | tee artifacts/candidate/build-debug.log

      - name: Build release
        run: |
          set -o pipefail
          HOME="$DUB_HOME" dub build --compiler=ldc2 --build=release 2>&1 \
            | tee artifacts/candidate/build-release.log

      - name: Run unit tests
        run: |
          set -o pipefail
          HOME="$DUB_HOME" dub test --compiler=ldc2 --config=unittest 2>&1 \
            | tee artifacts/candidate/unit-tests.log

      - name: Run repository latency validation
        if: ${{ hashFiles('scripts/run_latency_benchmark_ci.sh') != '' }}
        run: |
          set -o pipefail
          bash scripts/run_latency_benchmark_ci.sh 2>&1 \
            | tee artifacts/candidate/latency.log

      - name: Run repository NUMA validation
        if: ${{ hashFiles('benchmarks/numa/numa_locality.py') != '' }}
        run: |
          set -o pipefail
          python3 benchmarks/numa/numa_locality.py \
            --out-dir artifacts/candidate/numa \
            --threads 1 \
            --size-mib 32 \
            --stride 64 \
            --passes 2 2>&1 \
            | tee artifacts/candidate/numa.log

      - name: Run repository copy-budget validation
        if: ${{ hashFiles('scripts/check_copy_budget.py') != '' }}
        run: |
          set -o pipefail
          python3 scripts/check_copy_budget.py \
            --out-dir artifacts/candidate/copy-budget 2>&1 \
            | tee artifacts/candidate/copy-budget.log

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-candidate-${{ github.run_id }}
          path: artifacts
          if-no-files-found: error
